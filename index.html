<div id="modal-ui">
  <img src="" class="m-bg" id="mdl-bg">
  <div class="m-close"><div class="m-close-btn" onclick="clsMdl()">×</div></div>
  <div class="m-grid">
    <div class="m-l"><img src="" id="mdl-post"><button class="m-play" onclick="try2launch()">Play Now</button></div>
    <div class="m-r"><h1 class="m-t" id="mdl-t"></h1><div class="m-desc" id="mdl-dc"></div><div class="m-tgs" id="mdl-tg"></div></div>
  </div>
</div>

<div id="game-layer" style="display:none; position:fixed; inset:0; background:#000; z-index:900000;">
  <div id="bS" style="position:absolute; inset:0; background:#000; z-index:90002; display:flex; justify-content:center; align-items:center; color:#fff;">
    <h2 id="bS-t">Connecting to Cloud Server...</h2>
  </div>
  <iframe id="gF" allow="autoplay;fullscreen;pointer-lock;gamepad" style="width:100%; height:100%; border:none;"></iframe>
</div>

<script src="./gamelayout.js"></script>
<script>
// --- ORIGINAL CORE SYSTEMS ---
let lsDB = JSON.parse(localStorage.getItem('singularity_store_v10') || '{}');
function sLS() { localStorage.setItem('singularity_store_v10', JSON.stringify(lsDB)); }
let cxG = null; let isAuth = localStorage.getItem('singularity_authed') === 'true';

// --- AUTH ---
function openAuthTray() {
    document.getElementById('frame-area').classList.add('show');
    document.getElementById('rac-frame').src = "https://www.raccoongame.com/login?redirect_uri=https%3A%2F%2Fwww.raccoongame.com%2Fwap%2Fdist%2F%23%2Fplatform%2Fset&lang=en";
}
function markAsLoggedIn() {
    isAuth = true; localStorage.setItem('singularity_authed', 'true');
    document.getElementById('auth-success').style.display = 'block';
    document.getElementById('login-trigger').style.display = 'none';
    document.getElementById('frame-area').classList.remove('show');
}

// --- TAB SYSTEM ---
function chgTab(v) {
  document.querySelectorAll('.d-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-view').forEach(s => s.classList.remove('active'));
  document.getElementById('b-' + v).classList.add('active');
  document.getElementById('v-' + v).classList.add('active');
}

// --- GAME LOGIC ---
function opMdl(id) {
    cxG = G_DATA.find(x => x.id === id);
    document.getElementById('mdl-bg').src = cxG.bg;
    document.getElementById('mdl-post').src = cxG.img;
    document.getElementById('mdl-t').innerText = cxG.n;
    document.getElementById('mdl-dc').innerText = cxG.desc;
    document.getElementById('modal-ui').style.display = 'block';
    setTimeout(() => document.getElementById('modal-ui').style.opacity = '1', 10);
}
function clsMdl() { document.getElementById('modal-ui').style.opacity = '0'; setTimeout(() => document.getElementById('modal-ui').style.display = 'none', 400); }

function try2launch() {
    if(!isAuth) { alert("Please login in Tutorial tab first!"); chgTab('tut'); clsMdl(); return; }
    document.getElementById('game-layer').style.display = 'block';
    document.getElementById('bS').style.display = 'flex';
    document.getElementById('gF').src = cxG.url || cxG.path;
    document.getElementById('n-game-title').innerText = cxG.n;
    document.getElementById('n-game').style.display = 'flex';
    setTimeout(() => { document.getElementById('bS').style.display = 'none'; }, 4000);
    clsMdl();
}

function clsGm() {
    document.getElementById('gF').src = "";
    document.getElementById('game-layer').style.display = 'none';
    document.getElementById('n-game').style.display = 'none';
}

function tglV(v) { if(v==='h') clsGm(); }

// --- JOYSTICK LOGIC (FIXED) ---
let joyActive = false;
let joyData = { x: 0, y: 0 };
let mobileControlsActive = false;
let activeKeys = new Set();

function toggleMobileControls() {
    mobileControlsActive = !mobileControlsActive;
    document.getElementById('mobile-controls').classList.toggle('active');
    document.getElementById('mobile-toggle-btn').classList.toggle('active');
}

function setupJoystick() {
    const zone = document.getElementById('joystick-zone');
    const knob = document.getElementById('joystick-knob');
    if(!zone) return;

    const handleMove = (clientX, clientY) => {
        const rect = zone.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const maxDist = rect.width / 2;
        let dx = clientX - centerX;
        let dy = clientY - centerY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > maxDist) { dx *= maxDist / dist; dy *= maxDist / dist; }
        knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        joyData.x = dx / maxDist;
        joyData.y = dy / maxDist;
    };

    zone.addEventListener('touchstart', (e) => { e.preventDefault(); joyActive = true; handleMove(e.touches[0].clientX, e.touches[0].clientY); });
    zone.addEventListener('touchmove', (e) => { e.preventDefault(); if(joyActive) handleMove(e.touches[0].clientX, e.touches[0].clientY); });
    zone.addEventListener('touchend', () => { joyActive = false; knob.style.transform = 'translate(-50%, -50%)'; joyData = {x:0, y:0}; });
}

// The "Brain" Loop for Joystick
function gameLoop() {
    if (mobileControlsActive) {
        const t = 0.3; // Threshold
        const checkKey = (key, condition) => {
            if (condition && !activeKeys.has(key)) {
                document.dispatchEvent(new KeyboardEvent('keydown', { key: key, bubbles: true }));
                activeKeys.add(key);
            } else if (!condition && activeKeys.has(key)) {
                document.dispatchEvent(new KeyboardEvent('keyup', { key: key, bubbles: true }));
                activeKeys.delete(key);
            }
        };
        checkKey('ArrowUp', joyData.y < -t);
        checkKey('ArrowDown', joyData.y > t);
        checkKey('ArrowLeft', joyData.x < -t);
        checkKey('ArrowRight', joyData.x > t);
    }
    requestAnimationFrame(gameLoop);
}

// Buttons
function setupButtons() {
    const map = {'btn-a':'Enter', 'btn-b':'Escape', 'btn-x':'x', 'btn-y':'y'};
    Object.keys(map).forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); document.dispatchEvent(new KeyboardEvent('keydown', {key: map[id]})); });
        el.addEventListener('touchend', (e) => { e.preventDefault(); document.dispatchEvent(new KeyboardEvent('keyup', {key: map[id]})); });
    });
}

// --- PARTICLE SYSTEM ---
let pC, pCtx, pArr = [];
function rSz() { pC = document.getElementById('bg-particles'); pCtx = pC.getContext('2d'); pC.width = window.innerWidth; pC.height = window.innerHeight; iP(); }
function iP() { pArr = []; for(let i=0; i<50; i++) pArr.push({x:Math.random()*pC.width, y:Math.random()*pC.height, v:Math.random()*0.5+0.2}); }
function aP() { pCtx.clearRect(0,0,pC.width,pC.height); pCtx.fillStyle = "rgba(255,255,255,0.3)"; pArr.forEach(p => { p.y -= p.v; if(p.y < 0) p.y = pC.height; pCtx.beginPath(); pCtx.arc(p.x, p.y, 1, 0, Math.PI*2); pCtx.fill(); }); requestAnimationFrame(aP); }

// --- INIT ---
window.onload = () => {
    setTimeout(() => { document.getElementById('new-boot').style.opacity = '0'; }, 3000);
    rSz(); aP(); setupJoystick(); setupButtons(); gameLoop();
    let check = setInterval(() => {
        if(typeof G_DATA !== 'undefined') {
            clearInterval(check);
            document.getElementById('g-lib').innerHTML = G_DATA.map(g => `<div class="c-v" onclick="opMdl('${g.id}')"><img src="${g.img}"><div class="c-inf"><h3>${g.n}</h3></div></div>`).join('');
            document.getElementById('hc-img').src = G_DATA[0].bg; document.getElementById('hc-title').innerText = G_DATA[0].n;
        }
    }, 100);
    if(isAuth) markAsLoggedIn();
};
</script>
</body>
</html>
